name: Update Daily Rates

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update rates
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "DailyRatePK/1.0"}
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())

          def get_text(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "DailyRatePK/1.0"}
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", errors="ignore")

          # Currency + international metal reference rates
          fx = get_json("https://api.exchangerate.fun/latest?base=USD")

          rates = fx.get("rates", fx)

          usd_pkr = float(rates["PKR"])

          # Keep existing file as fallback
          with open("data.js", "r", encoding="utf-8") as f:
              old = f.read()

          # Current values from API
          xau = float(rates["XAU"])
          xag = float(rates["XAG"])

          # Convert USD/oz metal rates to PKR.
          # 1 troy ounce = 31.1034768 grams
          # 1 tola = 11.6638125 grams
          tola_ratio = 11.6638125 / 31.1034768

          gold_tola = (1 / xau) * usd_pkr * tola_ratio
          silver_tola = (1 / xag) * usd_pkr * tola_ratio

          gold_gram = gold_tola / 11.6638125
          gold_10g = gold_gram * 10

          silver_gram = silver_tola / 11.6638125
          silver_10g = silver_gram * 10

          gold22_tola = gold_tola * (22 / 24)

          # Pakistan fuel prices from PSO
          pso = get_text("https://psopk.com/en/fuels/fuel-prices")

          def find_price(pattern):
              m = re.search(pattern, pso, re.I | re.S)
              if not m:
                  return None
              return float(m.group(1))

          petrol = find_price(
              r"PREMIER EURO 5.*?Rs\.?\s*([0-9]+\.[0-9]+)\s*/Ltr"
          )

          diesel = find_price(
              r"HI-CETANE DIESEL EURO 5.*?Rs\.?[[:space:]]*([0-9]+\.[0-9]+)[[:space:]]*/Ltr"
          )

          lpg = find_price(
              r"LPG.*?Rs\.?\s*([0-9]+\.[0-9]+)\s*/KG"
          )

          # If PSO format changes, keep the previous fuel value
          def old_value(section, key):
              pattern = rf'{section}.*?{key}:\s*([0-9.]+)'
              m = re.search(pattern, old, re.S)
              return float(m.group(1)) if m else None

          if petrol is None:
              petrol = old_value("fuel", "petrol")

          if diesel is None:
              diesel = old_value("fuel", "diesel")

          if lpg is None:
              lpg = old_value("fuel", "lpg")

          updated = datetime.now(timezone.utc).strftime(
              "%B %d, %Y %H:%M UTC"
          )

          new_data = f'''const DAILY_RATES = {{
            updated: "Automatic update: {updated}",

            fuel: {{
              petrol: {petrol:.2f},
              diesel: {diesel:.2f},
              lpg: {lpg:.2f}
            }},

            metals: {{
              gold24kTola: {gold_tola:.2f},
              gold24k10g: {gold_10g:.2f},
              gold24kGram: {gold_gram:.2f},
              gold22kTola: {gold22_tola:.2f},
              silverTola: {silver_tola:.2f},
              silver10g: {silver_10g:.2f},
              silverGram: {silver_gram:.2f}
            }},

            currency: {{
              usd: {usd_pkr:.4f},
              aed: {float(rates.get("AED", 0)):.4f},
              sar: {float(rates.get("SAR", 0)):.4f},
              gbp: {float(rates.get("GBP", 0)):.4f}
            }}
          }};
          '''

          with open("data.js", "w", encoding="utf-8") as f:
              f.write(new_data)

          print(new_data)
          PY

      - name: Commit updated rates
        run: |
          git config user.name "DailyRatePK Bot"
          git config user.email "actions@github.com"
          git add data.js
          git diff --cached --quiet || git commit -m "Auto update daily rates"
          git push
