name: Update Daily Rates

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch latest Pakistan rates
        run: |
          python - <<'PY'
          import re
          import urllib.request
          import json
          from datetime import datetime, timezone

          def get_text(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0 DailyRatePK/1.0"}
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", errors="ignore")

          def money(text, pattern):
              m = re.search(pattern, text, re.I | re.S)
              if not m:
                  raise RuntimeError("Rate not found: " + pattern)
              return float(m.group(1).replace(",", ""))

          # -------------------------
          # FUEL - PSO
          # -------------------------
          pso = get_text("https://psopk.com/")

          petrol = money(
              pso,
              r"PREMIER EURO 5.*?Rs\.?\s*([0-9]+\.[0-9]+)\s*/Ltr"
          )

          diesel = money(
              pso,
              r"HI-CETANE DIESEL EURO 5.*?Rs\.?\s*([0-9]+\.[0-9]+)\s*/Ltr"
          )

          lpg = money(
              pso,
              r"LPG.*?Rs\.?\s*([0-9]+\.[0-9]+)\s*/KG"
          )

          # -------------------------
          # GOLD - Pakistan Sarafa
          # -------------------------
          gold_page = get_text(
              "https://gold.pk/gold-rates-karachi-khi.php"
          )

          gold_tola = money(
              gold_page,
              r"current per tola gold rate in Karachi.*?Rs\.?\s*([0-9,]+)"
          )

          # -------------------------
          # SILVER - Pakistan Sarafa
          # -------------------------
          silver_page = get_text(
              "https://gold.pk/pakistan-silver-rates-xagp.php"
          )

          silver_tola = money(
              silver_page,
              r"current per tola gold rate in Silver.*?Rs\.?\s*([0-9,]+)"
          )

          # -------------------------
          # Currency
          # -------------------------
          fx = get_text(
              "https://api.exchangerate.fun/latest?base=USD"
          )

          data = json.loads(fx)
          rates = data.get("rates", data)

          usd_pkr = float(rates["PKR"])

          # -------------------------
          # Metal conversions
          # -------------------------
          gold_gram = gold_tola / 11.6638125
          gold_10g = gold_gram * 10
          gold22_tola = gold_tola * (22 / 24)

          silver_gram = silver_tola / 11.6638125
          silver_10g = silver_gram * 10

          updated = datetime.now(timezone.utc).strftime(
              "%B %d, %Y %H:%M UTC"
          )

          new_data = f'''const DAILY_RATES = {{
            updated: "Automatic update: {updated}",

            fuel: {{
              petrol: {petrol:.2f},
              diesel: {diesel:.2f},
              lpg: {lpg:.2f}
            }},

            metals: {{
              gold24kTola: {gold_tola:.2f},
              gold24k10g: {gold_10g:.2f},
              gold24kGram: {gold_gram:.2f},
              gold22kTola: {gold22_tola:.2f},
              silverTola: {silver_tola:.2f},
              silver10g: {silver_10g:.2f},
              silverGram: {silver_gram:.2f}
            }},

            currency: {{
              usd: {usd_pkr:.4f},
              aed: {float(rates.get("AED", 0)):.4f},
              sar: {float(rates.get("SAR", 0)):.4f},
              gbp: {float(rates.get("GBP", 0)):.4f}
            }}
          }};
          '''

          with open("data.js", "w", encoding="utf-8") as f:
              f.write(new_data)

          print(new_data)
          PY

      - name: Commit updated rates
        run: |
          git config user.name "DailyRatePK Bot"
          git config user.email "actions@github.com"
          git add data.js
          git diff --cached --quiet || git commit -m "Auto update Pakistan rates"
          git push
